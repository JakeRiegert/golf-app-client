name: CI

on:
  push:
    branches: [main, gcp]
  pull_request:

# Build verification only -- no deploy target has been decided for the client yet (App
# Store/Play Store review flow, or a web hosting target), so this just keeps main from ever
# breaking analysis/tests, same spirit as the backend's cdk deploy but without a "deploy" step.
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version we develop and test with, so CI and local runs agree (an unpinned "stable" moves under
      # us). Raise it deliberately, with a local `flutter upgrade`, analyze and test, in the same commit.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
